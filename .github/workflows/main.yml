name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    # laeuft im DevContainer aus GHCR; `latest` zeigt immer auf die neueste
    # freigegebene Version (unfreigegebene Images bekommen nie diesen Tag)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crisissupercool/tictactestassignment-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # `test` ist finalizedBy `jacocoTestReport` - der Report entsteht mit
      - name: Build and test
        run: sh ./gradlew build --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/
          if-no-files-found: error

  # Coverage-Trend: Messwert an die Historie auf gh-pages anhaengen und
  # zusammen mit dem JaCoCo-Report veroeffentlichen. Nur bei Push auf main.
  coverage-pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-report
          path: report

      - name: Update history and build site
        run: |
          mkdir -p site
          # bisherige Historie holen; beim ersten Lauf gibt es gh-pages noch nicht
          if git clone --branch gh-pages --single-branch --depth 1 \
               "https://github.com/${GITHUB_REPOSITORY}.git" published 2>/dev/null; then
            cp published/coverage-history.csv site/ 2>/dev/null || true
          fi
          python3 scripts/coverage_history.py \
            report/jacocoTestReport.xml site/coverage-history.csv site/index.html "$GITHUB_SHA"
          cp -r report/html site/coverage

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
