# Freigabe des DevContainer-Images. Laeuft NUR auf einem Git-Tag
# `devcontainer-v<major>.<minor>.<patch>` - das Setzen des Tags ist die Freigabe.
# Dadurch existieren in GHCR ausschliesslich freigegebene Images.
name: DevContainer Release

on:
  push:
    tags: ['devcontainer-v*']

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag lesen
        run: echo "VERSION=${GITHUB_REF_NAME#devcontainer-v}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-devcontainer"
          docker build -f .devcontainer/Dockerfile -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      # Bump-PR: hebt die Version in devcontainer.json an, damit lokale
      # Umgebungen nach dem Merge automatisch das neue Image verwenden
      - name: Pull Request mit der neuen Version erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main && git switch -c "chore/devcontainer-$VERSION" origin/main
          # beim Bootstrap kennt main die Datei noch nicht
          if [ ! -f .devcontainer/devcontainer.json ]; then echo "main hat noch keinen DevContainer"; exit 0; fi
          sed -i -E "s|(-devcontainer:)[^\"]*|\1$VERSION|" .devcontainer/devcontainer.json
          if git diff --quiet; then echo "main ist bereits aktuell"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(devcontainer): Image $VERSION verwenden"
          git push --force -u origin "chore/devcontainer-$VERSION"
          gh pr create --base main --title "DevContainer $VERSION verwenden" \
            --body "Automatisch erstellt nach dem Push von \`$VERSION\` nach GHCR."
