plugins {
	id 'java'
	id 'jacoco'
}

// the release workflow passes the version of the git tag: ./gradlew build -PreleaseVersion=1.2.0
version = findProperty('releaseVersion') ?: '0.0.0-dev'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// runnable jar: java -jar build/libs/tictactest-<version>.jar
jar {
	archiveBaseName = 'tictactest'
	manifest {
		attributes 'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain',
				'Implementation-Version': project.version
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = '0.8.14'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = false
	}
	// every test run is directly followed by the coverage report
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true  // build/reports/jacoco/test/html/index.html
		xml.required = true   // machine readable, for coverage services
		csv.required = false
	}
}
