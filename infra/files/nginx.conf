user nginx;
pid /run/nginx.pid;
events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;

        # Versionsabfrage: die Datei schreibt tictactest-deploy bei jedem Deployment
        location = /version.txt {
            root /usr/share/nginx/html;
            default_type text/plain;
            add_header Access-Control-Allow-Origin * always;   # das Frontend liegt auf einer anderen Origin
            add_header Cache-Control no-store always;
        }

        # alles andere: Web-Konsole (ttyd lauscht nur auf localhost), inkl. WebSocket
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
